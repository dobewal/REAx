[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reax"
version = "0.4.0"
description = "Reverse Engineer Anything — improved. One command, zero setup, answers instead of primitives."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "dobewal" }]
keywords = [
    "reverse-engineering",
    "apk-analysis",
    "dex-analysis",
    "app-security",
    "mobile-security",
    "android-security",
    "malware-analysis",
    "static-analysis",
    "threat-intelligence",
    "agents",
    "ai-agents",
    "agent-skills",
    "mcp",
    "mcp-server",
    "claude-code",
    "cli",
    "decompiler",
    "ghidra",
    "frida",
]
dependencies = [
    "typer>=0.9",
    "rich>=13",
    "androguard>=4.0",
    "pyelftools>=0.30",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Software Development :: Debuggers",
]

[project.optional-dependencies]
mcp = ["fastmcp>=2.0"]
dev = ["pytest>=8"]

[project.scripts]
reax = "reax.cli:app"

[tool.setuptools.packages.find]
include = ["reax*"]
